[project]
name = "example"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.12.4",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "mcp[cli]>=1.18.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "seekingalpha"]

[tool.pytest.ini_options]
pythonpath = ["."]
